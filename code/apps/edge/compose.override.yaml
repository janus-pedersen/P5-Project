# Development on our laptops, where docker compose loads this file automatically
services:
  sensors:
    build:
      context: ../..
      dockerfile: apps/edge/sensors/Dockerfile
    pull_policy: build

  sync:
    build:
      context: ../..
      dockerfile: apps/edge/sync/Dockerfile
    pull_policy: build
    # Reaches the server running on the host machine
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      CLOUD_SYNC_URL: http://host.docker.internal:8787/device/sync
