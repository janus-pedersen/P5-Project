services:
  edge:
    build:
      context: ../..
      dockerfile: apps/edge/Dockerfile
    restart: unless-stopped
    # This is where the actual devices would connect
    # devices:
    #   - /dev/serial0:/dev/serial0
    #   - /dev/i2c-1:/dev/i2c-1
    environment:
      NODE_ENV: production
      TZ: Europe/Copenhagen
